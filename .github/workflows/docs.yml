name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install -r doc/requirements.txt
          .venv-docs/bin/python -m pip check

      - name: Build HTML with warnings as errors
        run: .venv-docs/bin/python -m sphinx -n -W --keep-going -b html doc doc/_build/html

      - name: Upload HTML for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-html
          path: doc/_build/html/
          if-no-files-found: error
          retention-days: 7
