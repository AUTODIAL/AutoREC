name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    env:
      PYTHON_JULIACALL_AUTOLOAD_IPYTHON_EXTENSION: "no"
      TF_CPP_MIN_LOG_LEVEL: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Configure temporary directories
        run: |
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/cache/matplotlib" >> "$GITHUB_ENV"
          echo "PYTHON_JULIAPKG_PROJECT=$RUNNER_TEMP/cache/julia_env" >> "$GITHUB_ENV"
          echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/cache/julia_depot" >> "$GITHUB_ENV"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q
