name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/cache
      MPLCONFIGDIR: ${{ runner.temp }}/cache/matplotlib
      PYTHON_JULIAPKG_PROJECT: ${{ runner.temp }}/cache/julia_env
      JULIA_DEPOT_PATH: ${{ runner.temp }}/cache/julia_depot
      PYTHON_JULIACALL_AUTOLOAD_IPYTHON_EXTENSION: "no"
      TF_CPP_MIN_LOG_LEVEL: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q
