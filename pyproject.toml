[build-system]
requires = ["setuptools>=68,<81", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "autorec_eis"
dynamic = ["version"]
description = "Building Reinforcement Learning Agent to Generate Circuit Models for EIS spectra"
readme = "README.md"
requires-python = ">=3.10,<3.12"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]
license = "MIT"
authors = [
  { name = "Ali Jaberi", email = "444ajaberi555@gmail.com" },
  { name = "Yonatan Kurniawan", email = "kurniawanyo@outlook.com" },
  { name = "Kabir Verma", email = "kverma@uwaterloo.ca" },
  { name = "Jason Hattrick-Simpers", email = "jason.hattrick.simpers@utoronto.ca" },
]
maintainers = [
  { name = "Ali Jaberi", email = "444ajaberi555@gmail.com" },
  { name = "Yonatan Kurniawan", email = "kurniawanyo@outlook.com" }
]
dependencies = [
  "arviz>=0.23,<0.24",
  "autoeis==0.0.44",
  "impedance>=1.7.1,<1.8",
  "jax==0.6.2",
  "jaxlib==0.6.2",
  "juliacall>=0.9.31,<0.10",
  "juliapkg>=0.1.23,<0.2",
  "keras==3.12.1",
  "lcapy==1.26",
  "matplotlib==3.10.9",
  "ml-dtypes==0.5.4",
  "numexpr==2.14.1",
  "numpy==2.2.6",
  "numpyro==0.19.0",
  "pandas==2.3.3",
  "pillow==12.2.0",
  "protobuf==7.34.1",
  "pyimpspec==5.1.2",
  "PyYAML>=6.0.2,<7",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "setuptools>=68,<81",
  "tensorflow==2.21.0",
  "tqdm==4.67.3",
]

[project.optional-dependencies]

notebook = [
  "ipykernel==6.29.5",
  "ipython==8.26.0",
  "ipywidgets==8.1.3",
  "jupyterlab==4.2.4",
]

dev = [
  "build>=1",
  "pre-commit>=3,<5",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
autorec = "autorec.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[project.urls]
Homepage = "https://github.com/AUTODIAL/AutoREC"
Repository = "https://github.com/AUTODIAL/AutoREC"
Paper = "https://arxiv.org/abs/2604.27266"
